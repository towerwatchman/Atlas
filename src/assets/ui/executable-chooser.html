<!DOCTYPE html>
<!--
  Executable chooser modal view.
  Shown by showExecutableChooser() when an imported/scanned archive contains
  more than one candidate executable. The user picks the main game launcher
  from the list; the selection is sent back over IPC (executable-chosen) and
  used as the game's primary executable. The layout mirrors the client's
  themed card style (MediaTab upload card) instead of a native <select>.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Executable</title>
  <style>
    :root {
      --bg-deep: var(--color-primary, #19191c);
      --bg-card: var(--color-secondary, #242629);
      --bg-hover: var(--color-tertiary, #313338);
      --bg-selected: var(--color-selected, #404249);
      --bg-button: var(--color-button, #313338);
      --accent: var(--color-accent, #2C8EA9);
      --accent-hover: var(--color-accent-hover, #24748A);
      --text-main: var(--color-text, #d2d2d2);
      --text-dim: var(--color-muted, #9CA3AF);
      --border-color: var(--color-border, #51535A);
      --radius-card: var(--radius-card-active, var(--radius-sm, 4px));
      --font-sans: "Inter", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    *::-webkit-scrollbar { width: 12px; height: 12px; }
    *::-webkit-scrollbar-track { background: var(--bg-deep); }
    *::-webkit-scrollbar-thumb { background-color: var(--border-color); border: 2px solid var(--bg-deep); border-radius: 999px; }
    *::-webkit-scrollbar-thumb:hover { background-color: var(--accent); }
    *::-webkit-scrollbar-corner { background: var(--bg-deep); }
    body {
      background: transparent;
      font-family: var(--font-sans);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    /* Mimics MediaTab upload card: bg-secondary border border-border rounded-md shadow-xl */
    .modal-container {
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    /* Header: p-3 border-b flex items-center justify-between — like MediaTab card header */
    .title-bar {
      padding: 12px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
    }
    .title-bar-text { font-size: 14px; font-weight: 600; color: var(--text-main); }
    .close-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .close-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    /* Content: p-3 space-y-3 — like MediaTab */
    .content { flex: 1; padding: 12px; display: flex; flex-direction: column; overflow: hidden; gap: 12px; }
    .subtitle { font-size: 12px; color: var(--text-dim); opacity: 0.8; line-height: 1.4; }
    .exe-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; max-height: 140px; scrollbar-width: thin; scrollbar-color: transparent transparent; }
    .exe-list:hover { scrollbar-color: var(--border-color) transparent; }
    .exe-list::-webkit-scrollbar { width: 6px; }
    .exe-list::-webkit-scrollbar-track { background: transparent; }
    .exe-list::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
    .exe-list:hover::-webkit-scrollbar-thumb { background: var(--border-color); }
    .exe-item { padding: 10px 12px; background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; font-size: 13px; word-break: break-all; color: var(--text-main); }
    .exe-item:hover { border-color: var(--text-dim); }
    .exe-item.selected { background: var(--bg-selected); border-color: var(--accent); color: var(--text-main); }
    .footer { padding: 12px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 8px; }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; font-family: var(--font-sans); }
    .btn-secondary { background: var(--bg-button); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: var(--bg-selected); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="modal-container">
    <div class="title-bar">
      <span class="title-bar-text">Select Main Executable</span>
      <button id="close-btn" class="close-btn">×</button>
    </div>
    <div class="content">
      <div class="subtitle">Multiple executables found. Please choose the main game launcher:</div>
      <div id="exe-list" class="exe-list"></div>
    </div>
    <div class="footer">
      <button id="cancel" class="btn btn-secondary">Cancel</button>
      <button id="confirm" class="btn btn-primary" disabled>Confirm</button>
    </div>
  </div>
<script>
  async function applyCurrentTheme() {
    try {
      if (!window.electronAPI?.getConfig) return;
      const [config, externalThemes] = await Promise.all([
        window.electronAPI.getConfig().catch(() => null),
        window.electronAPI.getAvailableThemes?.().catch(() => []) || []
      ]);
      const appearance = config?.Appearance || {};
      let theme = null;
      try {
        if (appearance.customTheme) theme = JSON.parse(appearance.customTheme);
      } catch {}
      if (!theme) {
        const themeId = String(appearance.themeId || 'default').toLowerCase();
        if (themeId === 'default') return;
        const list = Array.isArray(externalThemes) ? externalThemes : [];
        theme = list.find(t => String(t.id).toLowerCase() === themeId) || null;
      }
      if (!theme) return;
      const colors = theme.colors || {};
      const root = document.documentElement.style;
      const map = {
        primary: '--color-primary', secondary: '--color-secondary',
        tertiary: '--color-tertiary', border: '--color-border', selected: '--color-selected',
        accent: '--color-accent', accentHover: '--color-accent-hover', text: '--color-text',
        muted: '--color-muted', button: '--color-button'
      };
      for (const [key, cssVar] of Object.entries(map)) {
        if (colors[key]) root.setProperty(cssVar, colors[key]);
      }
      if (theme.font) root.setProperty('--font-sans', theme.font);
    } catch {}
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await applyCurrentTheme();
    let selectedExe = null;

    function renderList(executables) {
      const list = document.getElementById('exe-list');
      list.innerHTML = '';
      executables.forEach(exe => {
        const item = document.createElement('div');
        item.className = 'exe-item';
        item.textContent = exe;
        item.onclick = () => selectItem(item, exe);
        list.appendChild(item);
      });
    }

    function selectItem(element, exePath) {
      document.querySelectorAll('.exe-item').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedExe = exePath;
      document.getElementById('confirm').disabled = false;
    }

    document.getElementById('confirm').onclick = () => {
      if (selectedExe) {
        electronIPC.send('executable-chosen', { selectedExecutable: selectedExe });
      }
      window.close();
    };

    document.getElementById('cancel').onclick = () => {
      electronIPC.send('executable-chosen', { selectedExecutable: null });
      window.close();
    };

    document.getElementById('close-btn').onclick = () => {
      electronIPC.send('executable-chosen', { selectedExecutable: null });
      window.close();
    };

    electronIPC.on('init-executable-chooser', (data) => {
      const executables = data?.executables || [];
      selectedExe = null;
      document.getElementById('confirm').disabled = true;
      renderList(executables);
    });
  });
</script>
</body>
</html>
