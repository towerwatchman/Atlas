<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Atlas Extension</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #18181b;
      color: #f4f4f5;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .header img {
      width: 28px;
      height: 28px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #fafafa;
    }
    .status-card {
      background: #27272a;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #71717a;
    }
    .status-dot.connected {
      background-color: #22c55e;
      box-shadow: 0 0 6px #22c55eaa;
    }
    .status-dot.offline {
      background-color: #ef4444;
    }
    .btn {
      width: 100%;
      background: #3f3f46;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: #52525b;
    }
    .btn-primary {
      background: #4f46e5;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #71717a;
      text-align: center;
    }

    /* Pairing UI. Only shown when Atlas is reachable but rejects our token, so
       an already-paired user never sees any of this. */
    .pairing { display: flex; flex-direction: column; gap: 6px; padding: 10px;
      margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; }
    .pairing label { font-size: 12px; font-weight: 600; }
    .pairing-hint { font-size: 11px; opacity: 0.7; margin: 0; }
    .pairing input { width: 100%; box-sizing: border-box; padding: 6px 8px;
      font-size: 12px; font-family: monospace; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.25); color: inherit; }
    .pairing-msg { font-size: 11px; min-height: 14px; }
    .pairing-msg.ok { color: #4ade80; }
    .pairing-msg.err { color: #f87171; }
    .btn-subtle { opacity: 0.7; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/logo.png" alt="Atlas Logo">
    <h2>Atlas Extension</h2>
  </div>

  <div class="status-card">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">Checking connection...</span>
  </div>

  <div id="pairingBox" class="pairing" style="display: none;">
    <label for="tokenInput">Pairing token</label>
    <p class="pairing-hint">Atlas &rarr; Settings &rarr; Browser Extension &rarr; Copy Token</p>
    <input id="tokenInput" type="password" placeholder="Paste token from Atlas" autocomplete="off" spellcheck="false" />
    <button id="btnSaveToken" class="btn btn-primary">Pair with Atlas</button>
    <span id="tokenMsg" class="pairing-msg"></span>
  </div>

  <button id="btnAddPage" class="btn btn-primary" style="display: none;">
    Add Current Page to Atlas
  </button>
  <button id="btnOpenAtlas" class="btn">
    Open Atlas App
  </button>
  <button id="btnRefresh" class="btn">
    Sync Atlas Data
  </button>

  <button id="btnUnpair" class="btn btn-subtle" style="display: none;">
    Change pairing token
  </button>

  <div class="footer">
    Atlas Game Manager &bull; v1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
