name: Atlas Nightly Prerelease

on:
  push:
    branches:
      - nightly
  workflow_dispatch:

permissions:
  contents: write

# Two nightly runs overlapping would fight over the same release exactly as the
# matrix legs used to. Queue them instead of cancelling -- a half-uploaded
# release is worse than a slightly late one.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  # The 422 this job exists to prevent:
  #
  # Both matrix legs ran `electron-builder -p always` with releaseType=prerelease
  # at the same time, and within each leg the .exe and .exe.blockmap were
  # published by separate publisher instances. Four concurrent callers each saw
  # "release doesn't exist" and each POSTed to create it. GitHub answered
  # 422 "Published releases must have a valid tag", because a PUBLISHED release
  # needs its tag to exist, and the tag was still being created by whichever
  # caller got there first.
  #
  # So the release is created exactly once, here, as a draft. Drafts do not
  # require a resolvable tag -- it is cut when the draft is published at the
  # end. The build legs then find an existing release and only upload to it.
  #
  # Second benefit: if one platform fails, the release stays a draft instead of
  # going live with half its assets.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Computed once and passed to both legs. Previously each leg derived it
      # independently -- in cmd batch on Windows and bash on Linux -- so any
      # drift between the two produced two differently-named releases.
      - name: Resolve nightly version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          version="${base}-nightly.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $version"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # A re-run of the same run_number reuses the existing draft rather
          # than failing, so retrying a flaky build leg is safe.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Atlas ${{ steps.version.outputs.version }}" \
            --notes "Automated nightly build from ${{ github.sha }}."

  build-and-prerelease:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other mid-upload, which would
      # leave the draft holding a partial asset set.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: npm install
        shell: cmd

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm install
        shell: bash

      # bash is available on the Windows runners too, so both legs share one
      # step and take the version prepare already resolved. Nothing recomputes
      # it, so the two platforms cannot disagree about which release they are
      # uploading to.
      - name: Set nightly version
        shell: bash
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version
          echo "Nightly version: ${{ needs.prepare.outputs.version }}"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
          # appimagetool (bundled by electron-builder to build the AppImage
          # target) is itself an AppImage and needs FUSE2 to run. Ubuntu
          # 24.04 ("noble", what ubuntu-latest currently points to) renamed
          # libfuse2 -> libfuse2t64; fall back to the old name in case the
          # runner image changes again.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
        shell: bash

      - name: Build renderer (Windows)
        if: matrix.os == 'windows-latest'
        run: npx vite build
        shell: cmd

      - name: Build renderer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx vite build
        shell: bash

      - name: Build extension zip (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:extension
        shell: cmd

      - name: Build extension zip (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:extension
        shell: bash

      - name: Build and publish nightly (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 -p always --config.publish.releaseType=draft --config.publish.channel=nightly
        shell: cmd

      - name: Build and publish nightly (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 -p always --config.publish.releaseType=draft --config.publish.channel=nightly
        shell: bash

      - name: Verify Linux prerelease assets
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          linux_files=(release/*.deb release/*.AppImage release/*.pacman)
          if [ ${#linux_files[@]} -eq 0 ]; then
            echo "No Linux packages were produced in release/."
            exit 1
          fi

          tag="v$(node -p "require('./package.json').version")"
          linux_assets=$(gh release view "$tag" --json assets --jq '[.assets[].name | select(test("\\.(deb|AppImage|pacman)$"))] | length')
          if [ "$linux_assets" -eq 0 ]; then
            echo "Prerelease $tag does not contain Linux assets."
            exit 1
          fi
        shell: bash

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-nightly-installer
          path: release/*.exe
          if-no-files-found: warn

      - name: Upload Linux artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-nightly-installer
          path: |
            release/*.deb
            release/*.AppImage
            release/*.pacman
          if-no-files-found: error

  virus-scan:
    name: ClamAV scan of nightly artifacts
    needs: build-and-prerelease
    runs-on: ubuntu-latest
    # Report-only by default (see main.yml). Flip to 'true' to fail on hits.
    env:
      FAIL_ON_DETECTION: 'false'
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nightly-installer
          path: scan/windows
        continue-on-error: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-nightly-installer
          path: scan/linux
        continue-on-error: true

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true

      - name: Update virus definitions
        run: sudo freshclam || echo "freshclam returned non-zero (definitions may already be current); continuing."

      - name: Scan artifacts
        id: scan
        run: |
          set +e
          shopt -s nullglob globstar
          files=(scan/**/*.exe scan/**/*.AppImage scan/**/*.deb scan/**/*.pacman)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No nightly artifacts were downloaded to scan." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "detections=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "## ClamAV scan results (nightly)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | SHA-256 | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          total_infected=0
          for f in "${files[@]}"; do
            sha=$(sha256sum "$f" | awk '{print $1}')
            out=$(clamscan --no-summary --stdout "$f" 2>&1)
            code=$?
            name=$(basename "$f")
            if [ $code -eq 0 ]; then
              result="✅ Clean"
            elif [ $code -eq 1 ]; then
              sig=$(echo "$out" | grep -o ': .* FOUND' | sed 's/^: //; s/ FOUND$//' | paste -sd '; ' -)
              result="🚨 INFECTED — ${sig:-detection}"
              total_infected=$((total_infected + 1))
            else
              result="⚠️ Scan error (exit $code)"
            fi
            echo "| \`$name\` | \`$sha\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name  $sha  $result"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Report-only. For a multi-engine view, submit an artifact's SHA-256 at https://www.virustotal.com/gui/search_ ." >> "$GITHUB_STEP_SUMMARY"
          echo "detections=$total_infected" >> "$GITHUB_OUTPUT"

      - name: Enforce detection policy
        if: steps.scan.outputs.detections != '0' && env.FAIL_ON_DETECTION == 'true'
        run: |
          echo "ClamAV reported ${{ steps.scan.outputs.detections }} infected artifact(s) and FAIL_ON_DETECTION is true."
          exit 1

  # Nothing is visible to users until this runs. If either platform failed, the
  # draft stays a draft and no half-populated prerelease ever appears.
  publish-release:
    name: Publish nightly prerelease
    needs: [prepare, build-and-prerelease]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify both platforms uploaded, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"

          assets=$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(" ")')
          echo "Assets on $tag: $assets"

          # Publishing a release with only half the platforms is the failure the
          # old workflow could produce silently. Check before going live.
          win=$(echo "$assets" | tr ' ' '\n' | grep -c '\.exe$' || true)
          lin=$(echo "$assets" | tr ' ' '\n' | grep -cE '\.(deb|AppImage|pacman)$' || true)
          if [ "$win" -eq 0 ] || [ "$lin" -eq 0 ]; then
            echo "::error::Refusing to publish $tag -- Windows assets: $win, Linux assets: $lin."
            echo "The draft has been left in place so the missing build can be re-run."
            exit 1
          fi

          gh release edit "$tag" --draft=false --prerelease
          echo "Published $tag"

